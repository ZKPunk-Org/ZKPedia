[book]
authors = ["zkp-co-learning contributors"]
language = "zh"
multilingual = false
src = "src"
title = "ZKPunk's ZKPedia"
description = "A community-maintained zero-knowledge proof knowledge base."

[build]


# Translations are plain parallel Markdown under src-en/ -- no gettext/po pipeline.
# See src-en/how-to-contribute.md

[preprocessor]

[preprocessor.katex]
after = ["links"]
macros = "macros.txt"   # ref from https://github.com/Trapdoor-Tech/Halo2-Book/blob/master/book/macros.txt

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]
marker = "[TOC]"
max-level = 4

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.0" # do not edit: managed by `mdbook-admonish install`

[preprocessor.open-on-gh]
command = "mdbook-open-on-gh"
renderer = ["html"]


[preprocessor.mermaid]
command = "mdbook-mermaid"


[output.html]
# Required so the 404 page loads its CSS/JS when GitHub Pages serves it for a
# request deep in the tree (e.g. /en/plonk-intro-cn/...). Overridden to "/en/"
# for the English build; see the justfile.
site-url = "/"
mathjax-support = true
no-section-label = true
theme = "theme"
additional-js  = ["theme/mermaid.min.js", "theme/mermaid-init.js"]
additional-css = ["./mdbook-admonish.css", "theme/css/mdbook-admonish.css", "theme/css/open-in.css", "theme/css/english.css"]
git-repository-url = "https://github.com/ZKPunk-Org/ZKPedia"
open-on-text = "Found a bug?! [Edit this page on GitHub.]"
edit-url-template = "https://github.com/ZKPunk-Org/ZKPedia/edit/main/{path}"
curly-quotes = true   # replaces straight quotes with curly quotes


[output.html.fold]
enable = true   # whether or not to enable section folding
level = 0        # the depth to start folding

[output.html.search]
enable = true

# Builds both editions of ZKPedia with mdBook and publishes them to GitHub Pages.
#
#   book/      Chinese edition  -> https://learn.zkpunk.pro/
#   book/en/   English edition  -> https://learn.zkpunk.pro/en/
#
name: Deploy ZKPedia to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "src-en/**"
      - "theme/**"
      - "tools/**"
      - "justfile"
      - "book.toml"
      - "macros.txt"
      - "mdbook-admonish.css"
      - ".github/workflows/mdbook.yml"

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; never cancel a production deploy in flight.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        env:
          JUST_VERSION: "1.36.0"
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/just.tar.gz
          tar zxf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Install the mdBook toolchain
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          just init-builder

      - name: Build both editions
        run: just build

      - name: Check the build produced both editions
        run: |
          test -f book/index.html
          test -f book/CNAME
          test -f book/en/index.html
          test -f book/en/zkp-intro/1/zkp-back.html

      - name: Report English translation coverage
        run: just status

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
